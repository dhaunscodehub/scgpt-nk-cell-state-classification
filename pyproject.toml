[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nkstate"
version = "0.1.0"
description = "NK cell functional state classification with donor-grouped evaluation and an scGPT integration layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "single-cell", "scRNA-seq", "NK cells", "cell state", "scGPT",
    "data leakage", "donor-grouped cross-validation",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scanpy>=1.9",
    "anndata>=0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Test and development tooling.
dev = ["pytest>=7.4", "ruff>=0.4"]
# scGPT fine-tuning. The pretrained checkpoint is NOT installed by this extra:
# the authors distribute the weights themselves under their own terms. See
# docs/SCGPT.md.
scgpt = ["torch>=2.0", "scgpt>=0.2"]
# Everything needed to run every command and the full test suite.
all = ["pytest>=7.4", "ruff>=0.4", "torch>=2.0"]

[project.scripts]
nkstate = "nkstate.cli:main"

[project.urls]
Repository = "https://github.com/dhaunscodehub/scgpt-nk-cell-state-classification"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines in prose-heavy docstrings
    "B008",   # dataclass field defaults are intentional here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
